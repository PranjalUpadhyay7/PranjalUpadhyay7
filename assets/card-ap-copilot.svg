<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 58" width="720" height="58" role="img">
<title>AP-Copilot</title>
<desc>AP-Copilot, public repo. A safety-critical LLM agent that configures ArduPilot/Pixhawk parameters from plain-language requests; the model has no write tool, and deterministic validation plus a human-approval gate decide. Hybrid RAG with BM25, embeddings and RRF. On a 60-task benchmark the full system passed 59/60 for gpt-oss-20b versus 31/60 with retrieval and validation removed; no model produced an unsafe write on the full system. 480 tests, 219/219 mutants killed in the validation layer.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="720" height="58" rx="0" fill="#0B1020"/>
<rect x="2" y="2" width="716" height="54" rx="10" fill="#111832" stroke="#26345E" stroke-width="2"/><g transform="translate(10,2) scale(0.34)"><g class="float" style="animation-delay:0.0s"><path d="M80 26 L124 42 V82 C124 108 104 124 80 134 C56 124 36 108 36 82 V42 Z" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 70 V96 M98 70 V96 M62 84 H98" fill="none" stroke="#F5B544" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text class="" x="80" y="17" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.8" fill="#F5B544" font-weight="600">QUEST COMPLETE · PUBLIC REPO</text><text x="80" y="35" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF7">AP-Copilot</text><text x="80" y="50" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8FA0C0">The LLM can propose. It can never write.</text><rect x="557" y="5" width="151" height="22" rx="11" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="567" y="20" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">31/60 → 59/60 tasks</text><rect x="584" y="30" width="124" height="22" rx="11" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="594" y="45" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">0 unsafe writes</text>
</svg>
