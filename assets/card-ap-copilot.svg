<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" width="720" height="140" role="img">
<title>AP-Copilot</title>
<desc>AP-Copilot, public repo. A safety-critical LLM agent that configures ArduPilot/Pixhawk parameters from plain-language requests; the model has no write tool, and deterministic validation plus a human-approval gate decide. Hybrid RAG with BM25, embeddings and RRF. On a 60-task benchmark the full system passed 59/60 for gpt-oss-20b versus 31/60 with retrieval and validation removed; no model produced an unsafe write on the full system. 480 tests, 219/219 mutants killed in the validation layer.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="720" height="140" rx="0" fill="#0B1020"/>
<rect x="2" y="2" width="716" height="136" rx="12" fill="#111832" stroke="#26345E" stroke-width="2"/><g transform="translate(16,30) scale(0.5)"><g class="float" style="animation-delay:0.0s"><path d="M80 26 L124 42 V82 C124 108 104 124 80 134 C56 124 36 108 36 82 V42 Z" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 70 V96 M98 70 V96 M62 84 H98" fill="none" stroke="#F5B544" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text class="" x="112" y="22" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="#F5B544" font-weight="600">QUEST COMPLETE · PUBLIC REPO</text><text x="112" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF7">AP-Copilot</text><text x="112" y="66" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8FA0C0">The LLM can propose. It can never write.</text><rect x="112" y="76" width="168" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="125" y="92.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">31/60 → 59/60 tasks</text><rect x="290" y="76" width="138" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="303" y="92.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">0 unsafe writes</text><rect x="438" y="76" width="93" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="451" y="92.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">480 tests</text><rect x="112" y="106" width="191" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="125" y="122.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">219/219 mutants killed</text>
</svg>
