<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" width="720" height="465" role="img">
<title>Flight log</title>
<desc>Flight log of my journey, animated as a drone flying a mission route. 1. Launch · Iiser Bhopal: BS-MS, Computer Science + Data Science (graduating May 2027). 2. First Reps: Learned to think fast in contests (645 problems · CodeChef max 1644). 3. First Research: Made a transformer forget less (forgetting 18.7% → 14.8%). 4. Tcs Research · 2025: Taught a robot gripper to pick, in simulation (PPO policy · 20 object categories). 5. Moon Lab: Flew drones where GPS can't reach (VIO update 2x faster · flights at 50–80 m). 6. Thesis · Apr 2026: Rebuilt OpenVINS in Python, made it hover-aware (both repos open source). 7. Ap-Copilot · 2026: Built an LLM that can't write to the drone (60 tasks · 0 unsafe writes). 8. Next Waypoint: Your team. (full-time ML Engineer · India).</desc>
