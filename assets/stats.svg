 y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA0C0">latency, liquid NN</text></g><g class="t" style="animation-delay:0.75s"><rect x="551" y="2" width="167" height="116" rx="12" fill="#111832" stroke="#26345E" stroke-width="2"/><rect x="551" y="2" width="167" height="5" rx="2" fill="#F5B544"/><text x="634.5" y="60" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="30" font-weight="700" fill="#F5B544">-3.9 pp</text><text x="634.5" y="87" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA0C0">forgetting from my</text><text x="634.5" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA0C0">DyTox extension</text></g>
