e, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">VIO 7.5 → 3.7–4.0 ms</text><rect x="502" y="30" width="206" height="22" rx="11" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="512" y="45" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">4.5 FPS YOLO on Jetson Nano</text>
