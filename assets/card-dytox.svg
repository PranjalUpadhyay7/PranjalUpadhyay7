<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 58" width="720" height="58" role="img">
<title>DyTox Modification</title>
<desc>Two extensions to the DyTox continual-learning transformer on CIFAR-100. The Task-Aware Encoder cut forgetting from 18.7% to 14.8%. Dynamic Contextual Positional Embeddings cost 3.2 to 3.3 points, which I report.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="720" height="58" rx="0" fill="#0B1020"/>
<rect x="2" y="2" width="716" height="54" rx="10" fill="#111832" stroke="#26345E" stroke-width="2"/><g transform="translate(10,2) scale(0.34)"><g class="float" style="animation-delay:0.0s"><path d="M80 34 L132 56 L80 78 L28 56 Z" fill="#111832" stroke="#8FA0C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 56 L132 78 L80 100 L28 78 Z" fill="#111832" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 78 L132 100 L80 122 L28 100 Z" fill="#111832" stroke="#F5B544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text class="" x="80" y="17" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.8" fill="#F5B544" font-weight="600">QUEST COMPLETE · PUBLIC REPO</text><text x="80" y="35" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E6EDF7">DyTox Modification</text><text x="80" y="50" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8FA0C0">One extension helped. One cost 3.2 points. Both shown.</text><rect x="529" y="5" width="179" height="22" rx="11" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="539" y="20" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">forgetting 18.7 → 14.8%</text><rect x="543" y="30" width="165" height="22" rx="11" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="553" y="45" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E6EDF7">DCPE cost 3.2–3.3 pts</text>
</svg>
