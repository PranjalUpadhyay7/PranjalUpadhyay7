<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" role="img">
<title>DyTox Modification</title>
<desc>Two extensions to the DyTox continual-learning transformer on CIFAR-100. The Task-Aware Encoder cut forgetting from 18.7% to 14.8%. Dynamic Contextual Positional Embeddings cost 3.2 to 3.3 points, which I report.</desc>
<rect width="720" height="170" rx="0" fill="#0B1020"/>
<rect x="2" y="2" width="716" height="166" rx="14" fill="#111832" stroke="#26345E" stroke-width="2"/><g transform="translate(22,25) scale(0.75)"><path d="M80 34 L132 56 L80 78 L28 56 Z" fill="#111832" stroke="#8FA0C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 56 L132 78 L80 100 L28 78 Z" fill="#111832" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 78 L132 100 L80 122 L28 100 Z" fill="#111832" stroke="#F5B544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="172" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#F5B544" font-weight="600">PUBLIC REPO</text><text x="172" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E6EDF7">DyTox Modification</text><text x="172" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8FA0C0">Continual-learning transformer: one win, one failure</text><rect x="172" y="118" width="233" height="30" rx="15" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="185" y="138" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF7">forgetting 18.7 → 14.8%</text><rect x="415" y="118" width="215" height="30" rx="15" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="428" y="138" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF7">DCPE cost 3.2–3.3 pts</text>
</svg>
