<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 110" width="720" height="110" role="img">
<title>DyTox Modification</title>
<desc>Two extensions to the DyTox continual-learning transformer on CIFAR-100. The Task-Aware Encoder cut forgetting from 18.7% to 14.8%. Dynamic Contextual Positional Embeddings cost 3.2 to 3.3 points, which I report.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="720" height="110" rx="0" fill="#0B1020"/>
<rect x="2" y="2" width="716" height="106" rx="12" fill="#111832" stroke="#26345E" stroke-width="2"/><g transform="translate(16,15) scale(0.5)"><g class="float" style="animation-delay:0.0s"><path d="M80 34 L132 56 L80 78 L28 56 Z" fill="#111832" stroke="#8FA0C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 56 L132 78 L80 100 L28 78 Z" fill="#111832" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 78 L132 100 L80 122 L28 100 Z" fill="#111832" stroke="#F5B544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text class="" x="112" y="22" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="#F5B544" font-weight="600">QUEST COMPLETE · PUBLIC REPO</text><text x="112" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#E6EDF7">DyTox Modification</text><text x="112" y="66" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8FA0C0">One extension helped. One cost 3.2 points. Both shown.</text><rect x="112" y="76" width="198" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="125" y="92.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">forgetting 18.7 → 14.8%</text><rect x="320" y="76" width="183" height="24" rx="12.0" fill="#0B1020" stroke="#26345E" stroke-width="1.5"/><text x="333" y="92.4" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#E6EDF7">DCPE cost 3.2–3.3 pts</text>
