<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 58" width="720" height="58" role="img">
<title>OpenVINS in Python</title>
<desc>A Python port of the OpenVINS MSCKF visual-inertial estimator, plus a hovering-aware extension that implements the motion-classification algorithm of Kottas, Wu and Roumeliotis (IROS 2014), for which no reference code was published. It is the implementation behind my BS thesis at IISER Bhopal (April 2026). Validated on a Jetson Orin Nano UAV against the KAIST VIO benchmark and a custom hovering flight dataset.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
