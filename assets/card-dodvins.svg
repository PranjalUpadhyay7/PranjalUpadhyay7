<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 58" width="720" height="58" role="img">
<title>DODVins: OpenVINS, but faster</title>
<desc>DODVins, a data-oriented C++ reimplementation of the OpenVINS MSCKF visual-inertial odometry pipeline, by Shafwan Safi, Nikhil Vashisht and Pranjal Upadhyay (project lead). Same filter equations, different memory layout. On ten public sequences in the same toolchain container it matches OpenVINS accuracy (mean ATE 0.156 m vs 0.158 m, better on 4 of 10) while running 1.76 to 2.10x faster end to end, and it is faster on all ten on a Jetson Orin Nano. Paper and presentation are in the repo.</desc>
<style>.float{animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
