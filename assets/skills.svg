<title>Skills</title>
<desc>Skills. Ml &amp; Deep Learning: PyTorch, TabM, LSTM, Transformers, Continual learning, Federated learning, RL (PPO), Object detection. Robotics: VIO: OpenVINS, MSCKF, EKF, Visual SLAM, GNSS-denied navigation, PyBullet, Adaptive control, ROS 2, Drone + edge hardware. Genai &amp; Nlp: LangGraph, Hybrid RAG, Agent guardrails, AWS Bedrock, Whisper. Languages: Python, C++, TypeScript, Rust. Deployment: FastAPI, TensorRT FP16, Jetson Nano / Orin Nano, ArduPilot, pytest + mutmut.</desc>
